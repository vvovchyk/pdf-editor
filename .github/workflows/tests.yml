name: CI and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pdfcleaner.tar.gz"
          git archive --format=tar "$GITHUB_SHA" | gzip -n > "$archive"
          test -s "$archive"
          tar -tzf "$archive" | grep -Fx app.py >/dev/null

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          archive="/tmp/pdfcleaner-${GITHUB_SHA}.tar.gz"
          scp -o StrictHostKeyChecking=yes "$RUNNER_TEMP/pdfcleaner.tar.gz" "$SSH_USER@$SSH_HOST:$archive"
          ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "
            set -e
            trap 'rm -f \"$archive\"' EXIT
            tar -xzf \"$archive\" -C /var/www/pdfcleaner
            /var/www/pdfcleaner/venv/bin/python -m pip install -r /var/www/pdfcleaner/requirements.txt
            systemctl restart pdfcleaner
            for attempt in \$(seq 1 15); do
              if curl -fsS http://127.0.0.1:5000/ >/dev/null; then
                echo 'PDF Cleaner is responding.'
                exit 0
              fi
              sleep 2
            done
            systemctl status pdfcleaner --no-pager
            exit 1
          "
