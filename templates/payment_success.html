<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment complete</title>
    <script src="https://sackofhacks.com/static/es.js?v=3" defer></script>
    <script src="https://sackofhacks.com/static/it.js?v=2" defer></script>
    <script src="https://sackofhacks.com/static/pl.js?v=2" defer></script>
    <script src="https://sackofhacks.com/static/nb.js?v=2" defer></script>
    <script src="https://sackofhacks.com/static/i18n.js?v=4" defer></script>
</head>
<body>
    <div data-language-picker></div>
    {% if payment_complete %}
        <p>Payment verified. You can return to the PDF editor.</p>
    {% else %}
        <p>Payment is processing. Keep the PDF editor open; it will update automatically.</p>
    {% endif %}
    <script>
        if (window.opener) {
            window.opener.postMessage(
                { type: {{ ("pdf-payment-complete" if payment_complete else "pdf-payment-pending") | tojson }} },
                window.location.origin
            );
            if ({{ payment_complete | tojson }}) window.close();
        }
    </script>
</body>
</html>
